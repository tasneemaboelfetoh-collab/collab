<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Reminder</title>
    <link rel="stylesheet" href="css/med.css">
</head>
<body>

    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>
    <div class="shape shape-three"></div>

    <main class="container">

        <header>
            <div class="logo">💊</div>
            <h1>Medicine Reminder</h1>
            <p>Take care of yourself, one reminder at a time 💙</p>
        </header>

        <section class="form-box">
            <h2>Add New Reminder</h2>

            <div class="input-group">
                <label>Medicine Name</label>
                <input type="text" id="medicineName" placeholder="Enter medicine name">
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Time</label>
                    <input type="time" id="medicineTime">
                </div>

                <div class="input-group">
                    <label>Frequency</label>
                    <select id="frequency">
                        <option>Once a day</option>
                        <option>Twice a day</option>
                        <option>Three times a day</option>
                    </select>
                </div>
            </div>

            <button id="addBtn">+ Add Reminder</button>
        </section>

        <section class="reminders-section">

            <div class="section-title">
                <div>
                    <h2>My Reminders</h2>
                    <p>Your daily schedule</p>
                </div>

                <span id="count">0</span>
            </div>

            <div id="remindersList">
                <div class="empty">
                    <div>♡</div>
                    <p>No reminders yet</p>
                    <span>Add your first reminder above</span>
                </div>
            </div>

        </section>

    </main>

    <script src="js/med.js"></script>
</body>
</html>
